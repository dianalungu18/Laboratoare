<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
        background-color: #ffffcc;
    }
    
    .center {
        text-align: center;
        color: white;
    }
    
    h1 {
        background-color: #00cc66;
        color: orange;
    }
    
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }
    
    .centre {
        border: 5px solid blue;
        padding: 15px;
    }
    
    #s1 {
        background-color: #00cc66;
    }
    
    #s2 {
        background-color: yellow;
    }
    
    div {
        color: blue;
    }

    /* Am pus fundal albastru primului tabel */
    #s1 table {
        background-color: blue;
    }

    /* Uniformizare celule din al doilea tabel ca să arate la fel */
    #s2 table th, #s2 table td {
        border: 2px solid blue;
        padding: 10px;
    }
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 

<div id="s2" style="width:50%">
<br>
<table style="width:100%">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 

<!-- 
Explicații Ex3
1. Tabelele au fundaluri diferite deoarece ele sunt transparente în mod natural, primul preia culoarea verde a div-ului #s1, iar al doilea preia culoarea galbenă a div-ului #s2. Prin adregăurirea regulii "#s1 table { background-color: blue; }", am forțat primul tabel să aibă fundal albastru.
2. Celulele celui de-al doilea tabel arătau diferit deoarece clasa ".centre" era pusă selectiv doar pe unele elemente. Prin aplicarea uniformă a chenarului și padding-ului pe toate celulele din al doilea tabel, aspectul lor a devenit omogen.
-->
</body>
</html>
