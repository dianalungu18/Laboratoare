<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

    #hd {
        font-variant: small-caps;
        color: magenta;
    }

    body {
        background-color: #ffffcc;
    }

    .center, p {
        text-align: center;
        color: red;
    }

    /* === Stiluri Exercițiul 6 === */
    
    
    table {
        border-collapse: collapse;
        width: 100%;
        border: 2px solid green;
    }

    
    caption {
        background-color: orange;
        color: white;
        font-size: 1.4em;
        font-weight: bold;
        padding: 10px;
    }

    
    th {
        background-color: magenta;
        color: black;
        border: 1px solid green;
        padding: 12px;
        text-align: center;
    }

    
    td {
        background-color: orange;
        color: black;
        border: 1px solid green;
        padding: 10px;
        text-align: center;
    }

    
    td.echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
    }

</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table>
  <caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <!-- Clasa "echipa" aplică fondul magenta și textul îngroșat -->
    <td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Ștefănescu</td>
    <td>cantat</td>
    <td>olarit</td>
  </tr>
  <tr>
    <td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Iliescu</td>
    <td>pictat</td>
    <td>gimnastica</td>
  </tr>
</table>

</body>
</html>
