<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Garaj</title>
<style>
body { background-color: LightGoldenRodYellow; font-family: Arial, sans-serif; }
table { border-collapse: collapse; margin-top: 15px; }
th, td { border: 2px solid green; padding: 8px 14px; }
th { background-color: LightGreen; }
</style>
<script>
// citește tabloul din Local Storage sau [] dacă cheia nu există
function citesteGaraj(){
	var text = localStorage.getItem("garaj");
	if(text){
		return JSON.parse(text);
	}
	return [];
}

// salvează tabloul înapoi, ca text JSON
function salveazaGaraj(garaj){
	localStorage.setItem("garaj", JSON.stringify(garaj));
}

// reface complet tabelul și numărul de mașini
function afiseazaGaraj(){
	var garaj = citesteGaraj();
	document.getElementById("numar").innerHTML = "Mașini în garaj: " + garaj.length;

	var html = "<tr><th>Nr.</th><th>Tip</th><th>Model</th><th>Culoare</th><th>An</th><th></th></tr>";
	for(var i = 0; i < garaj.length; i++){
		html += "<tr>" +
			"<td>" + (i + 1) + "</td>" +
			"<td>" + garaj[i].tip + "</td>" +
			"<td>" + garaj[i].model + "</td>" +
			"<td>" + garaj[i].culoare + "</td>" +
			"<td>" + garaj[i].anFab + "</td>" +
			"<td><button type='button' onclick='stergeMasina(" + i + ")'>Șterge</button></td>" +
			"</tr>";
	}
	document.getElementById("tabel").innerHTML = html;
}

// adaugă o mașină din formular
function adaugaMasina(){
	var garaj = citesteGaraj();
	garaj.push({
		tip : document.getElementById("tip").value,
		model : document.getElementById("model").value,
		culoare : document.getElementById("culoare").value,
		anFab : Number(document.getElementById("an").value)
	});
	salveazaGaraj(garaj);
	document.getElementById("formular").reset();   // golește câmpurile
	afiseazaGaraj();
	return false;
}

// scoate mașina de pe poziția i
function stergeMasina(i){
	var garaj = citesteGaraj();
	garaj.splice(i, 1);
	salveazaGaraj(garaj);
	afiseazaGaraj();
}
</script>
</head>
<body onload="afiseazaGaraj()">

<h1>Garajul meu</h1>

<form id="formular" onsubmit="return adaugaMasina()">
	<label for="tip">Tip</label> <input id="tip" required>
	<label for="model">Model</label> <input id="model" required>
	<label for="culoare">Culoare</label> <input id="culoare" required>
	<label for="an">An fabricație</label> <input id="an" type="number" min="1900" max="2100" required>
	<button type="submit">Adaugă</button>
</form>

<p id="numar"></p>

<table id="tabel"></table>

<p><a href="index.html">Înapoi la laboratorul 7</a></p>

</body>
</html>
