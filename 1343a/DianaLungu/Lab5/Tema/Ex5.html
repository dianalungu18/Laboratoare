<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Ex5 – Alerte și fundalul paginii</title>
</head>
<body>

<h1>Ordinea de încărcare a paginii</h1>

<script>
window.alert("Titlul s-a încărcat. Urmează primul paragraf.");
</script>

<p onclick="document.body.style.backgroundColor = 'yellow';">
    Primul paragraf: dă clic aici și fundalul paginii devine galben.
</p>

<script>
window.alert("Primul paragraf s-a încărcat. Urmează al doilea paragraf.");
</script>

<p onclick="document.body.style.backgroundColor = 'orange';">
    Al doilea paragraf: dă clic aici și fundalul paginii devine portocaliu.
</p>

<p><a href="index.html">Înapoi la exerciții</a></p>

</body>
</html>
